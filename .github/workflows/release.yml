name: Release macOS app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag matching package.json, for example v0.1.0
        required: true
        type: string
      prerelease:
        description: Mark this release as a prerelease
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and release Apple silicon app
    runs-on: macos-15
    steps:
      - name: Check out Ernie
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install Nub
        run: npm install --global @nubjs/nub@0.7.5

      - name: Prepare local Agentation dependency
        run: |
          sudo mkdir -p /Users/thor/work
          sudo chown -R "$USER" /Users/thor/work
          git clone --depth 1 https://github.com/thoriqakbar0/agentation.git /Users/thor/work/agentation

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          package_version="$(nub --node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          test "$RELEASE_TAG" = "v$package_version"

      - name: Install dependencies
        run: nub install --frozen-lockfile

      - name: Run checks
        run: nub run check

      - name: Validate Apple credentials
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          configured=0
          missing=0
          for name in \
            MACOS_CERTIFICATE_P12 \
            MACOS_CERTIFICATE_PASSWORD \
            MACOS_SIGNING_IDENTITY \
            APP_STORE_CONNECT_API_KEY \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID
          do
            if [ -n "${!name}" ]; then
              configured=$((configured + 1))
            else
              missing=$((missing + 1))
            fi
          done
          if [ "$configured" -ne 0 ] && [ "$missing" -ne 0 ]; then
            echo "Configure all six Apple release secrets or leave all six unset." >&2
            exit 1
          fi

      - name: Import Apple signing credentials
        if: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          certificate_path="$RUNNER_TEMP/ernie-certificate.p12"
          keychain_path="$RUNNER_TEMP/ernie-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$certificate_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain_path"
          security list-keychain -d user -s "$keychain_path"

      - name: Prepare notarization credentials
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY != '' }}
        env:
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          api_key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          printf '%s' "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$api_key_path"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$api_key_path" >> "$GITHUB_ENV"

      - name: Build macOS package
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: nub run package:mac

      - name: Upload build evidence
        uses: actions/upload-artifact@v7
        with:
          name: ernie-${{ inputs.tag }}-mac-arm64
          path: |
            .build/release/*.zip
            .build/release/*.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          release_arguments=(
            "$RELEASE_TAG"
            .build/release/*.zip
            .build/release/*.sha256
            --target "$GITHUB_SHA"
            --title "Ernie $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = "true" ]; then
            release_arguments+=(--prerelease)
          fi
          gh release create "${release_arguments[@]}"
