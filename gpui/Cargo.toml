[workspace]
resolver = "2"
members = ["crates/desktop", "crates/ui"]
default-members = ["crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "101ca00a1352ed71ef398f21b47836565d1998e3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "101ca00a1352ed71ef398f21b47836565d1998e3" }
gpui-app-ui = { path = "crates/ui" }

[workspace.lints.rust]
unsafe_code = "forbid"
