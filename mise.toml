[tools]
node = "26"
"npm:@nubjs/nub" = "0.7.5"

[settings]
lockfile = true

[tasks.setup]
description = "Install locked dependencies"
run = "nub install --frozen-lockfile"

[tasks.dev]
description = "Start Ernie in development mode"
run = "nub run dev"

[tasks.check]
description = "Run Ernie's required local checks"
run = "nub run check"
