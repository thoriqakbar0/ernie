# Keep live Electron, socket, and Prime Agent work outside these benchmarks.
# Their results depend on mutable processes, credentials, and network state.
# Run `nub run build:main` before `tak run` so ui-control-load matches current source.

[bench.ui-control-load]
cmd = ["node", ".build/main/packages/ernie-ui-control/index.js"]
runs = 20
warmup = 3

[bench.main-typecheck]
cmd = ["node", "node_modules/typescript/bin/tsc", "--noEmit", "--project", "tsconfig.main.json"]
runs = 5
warmup = 1

[bench.renderer-typecheck]
cmd = ["node", "node_modules/typescript/bin/tsc", "--noEmit", "--project", "tsconfig.json"]
runs = 5
warmup = 1
